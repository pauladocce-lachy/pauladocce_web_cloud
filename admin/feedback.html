<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Připomínky | Paula Docce Admin</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <header class="admin-header">

        <h1>Připomínky webmasterovi</h1>

        <a href="dashboard.html" class="logout-btn">
            ← Dashboard
        </a>

    </header>

    <section class="feedback-page">

        <div class="feedback-card">

            <h2>Napište připomínku</h2>

            <p>
                Máte nápad nebo potřebujete něco upravit na webu?
                Napište zprávu a odešlete ji.
            </p>

            <textarea
                id="feedbackMessage"
                placeholder="Sem napište připomínku..."
            ></textarea>

            <button id="sendFeedbackBtn" class="save-btn">
                Odeslat připomínku
            </button>

            <hr>

<h2>Odeslané připomínky</h2>

<div id="feedbackList"></div>
            
        </div>

    </section>

</div>
<script src="../js/api.js"></script>
<script src="../js/requests-api.js"></script>
<script src="js/feedback.js"></script>

</body>

</html>
